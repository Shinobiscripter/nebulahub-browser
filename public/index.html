<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#070a12" />
		<meta
			name="description"
			content="NebulaHub Browser — a space-themed browser interface powered by Scramjet."
		/>
		<title>NebulaHub Browser</title>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="stylesheet" href="/index.css" />
		<script src="/scram/scramjet.all.js"></script>
		<script src="/baremux/index.js"></script>
		<script src="/register-sw.js" defer></script>
		<script src="/search.js" defer></script>
		<script src="/index.js" defer></script>
	</head>
	<body>
		<div class="space-backdrop" aria-hidden="true"></div>
		<div class="space-shade" aria-hidden="true"></div>

		<main id="home-view" class="home-view">
			<div class="home-brand" aria-label="NebulaHub Browser">
				<svg
					class="brand-mark"
					viewBox="0 0 48 48"
					role="img"
					aria-label="NebulaHub"
				>
					<path
						d="M9.5 30.5c7.6 7.9 20.5 9.2 28.7 2.4 5.2-4.4 5.3-11.1 1.9-15.4-3.8-4.8-10.5-4.2-13.5-.2-2.6 3.5-1.3 8 2 9.8 2.9 1.6 6.5.3 7.2-2.2"
					/>
					<path
						d="M38.5 17.5C30.9 9.6 18 8.3 9.8 15.1 4.6 19.5 4.5 26.2 7.9 30.5"
					/>
					<circle cx="13.3" cy="13.1" r="1.5" />
				</svg>
				<div>
					<div class="brand-name">NebulaHub</div>
					<div class="brand-product">Browser</div>
				</div>
			</div>

			<section class="launch-panel" aria-label="Open a website">
				<form id="home-form" class="address-form home-address-form">
					<label class="sr-only" for="home-address"
						>Search or enter a URL</label
					>
					<svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
						<circle cx="11" cy="11" r="6.5" />
						<path d="m16 16 4 4" />
					</svg>
					<input
						id="home-address"
						type="text"
						inputmode="url"
						autocomplete="off"
						autocapitalize="none"
						spellcheck="false"
						placeholder="Search or enter a URL"
						autofocus
					/>
					<button class="go-button" type="submit" aria-label="Open">
						<svg viewBox="0 0 24 24" aria-hidden="true">
							<path d="m9 5 7 7-7 7" />
						</svg>
					</button>
				</form>
				<div class="shortcuts" aria-label="Shortcuts">
					<button
						class="shortcut"
						type="button"
						data-url="https://www.wikipedia.org"
					>
						<span class="shortcut-icon">W</span><span>Wikipedia</span>
					</button>
					<button class="shortcut" type="button" data-url="https://github.com">
						<span class="shortcut-icon">GH</span><span>GitHub</span>
					</button>
					<button
						class="shortcut"
						type="button"
						data-url="https://www.youtube.com"
					>
						<span class="shortcut-icon play-icon"
							><svg viewBox="0 0 24 24" aria-hidden="true">
								<path d="m9 7 8 5-8 5Z" /></svg></span
						><span>YouTube</span>
					</button>
				</div>
			</section>
			<p
				id="home-status"
				class="home-status"
				role="status"
				aria-live="polite"
			></p>
		</main>

		<section
			id="browser-view"
			class="browser-view"
			aria-label="NebulaHub Browser"
			hidden
		>
			<header class="browser-toolbar">
				<div class="window-brand" aria-hidden="true">
					<svg class="mini-mark" viewBox="0 0 48 48">
						<path
							d="M9.5 30.5c7.6 7.9 20.5 9.2 28.7 2.4 5.2-4.4 5.3-11.1 1.9-15.4-3.8-4.8-10.5-4.2-13.5-.2-2.6 3.5-1.3 8 2 9.8"
						/>
						<path
							d="M38.5 17.5C30.9 9.6 18 8.3 9.8 15.1 4.6 19.5 4.5 26.2 7.9 30.5"
						/>
					</svg>
				</div>
				<nav class="browser-controls" aria-label="Browser controls">
					<button
						id="back-button"
						class="icon-button"
						type="button"
						aria-label="Back"
						title="Back"
					>
						<svg viewBox="0 0 24 24" aria-hidden="true">
							<path d="m15 5-7 7 7 7" />
						</svg>
					</button>
					<button
						id="forward-button"
						class="icon-button"
						type="button"
						aria-label="Forward"
						title="Forward"
					>
						<svg viewBox="0 0 24 24" aria-hidden="true">
							<path d="m9 5 7 7-7 7" />
						</svg>
					</button>
					<button
						id="reload-button"
						class="icon-button"
						type="button"
						aria-label="Reload"
						title="Reload"
					>
						<svg viewBox="0 0 24 24" aria-hidden="true">
							<path d="M19 7v5h-5" />
							<path d="M18.2 12A7 7 0 1 0 19 16" />
						</svg>
					</button>
					<button
						id="home-button"
						class="icon-button"
						type="button"
						aria-label="Home"
						title="Home"
					>
						<svg viewBox="0 0 24 24" aria-hidden="true">
							<path d="m4 11 8-7 8 7" />
							<path d="M6.5 9.5V20h11V9.5" />
						</svg>
					</button>
				</nav>
				<form id="toolbar-form" class="address-form toolbar-address-form">
					<label class="sr-only" for="toolbar-address"
						>Search or enter a URL</label
					>
					<svg class="site-icon" viewBox="0 0 24 24" aria-hidden="true">
						<circle cx="12" cy="12" r="8" />
						<path
							d="M4 12h16M12 4c2.2 2.3 3.2 5 3.2 8S14.2 17.7 12 20M12 4c-2.2 2.3-3.2 5-3.2 8s1 5.7 3.2 8"
						/>
					</svg>
					<input
						id="toolbar-address"
						type="text"
						inputmode="url"
						autocomplete="off"
						autocapitalize="none"
						spellcheck="false"
						placeholder="Search or enter a URL"
					/>
				</form>
			</header>
			<div class="progress-track" aria-hidden="true">
				<div id="loading-bar" class="loading-bar"></div>
			</div>
			<div id="page-stage" class="page-stage">
				<div id="page-loading" class="page-message" aria-live="polite">
					<span class="orbit-loader" aria-hidden="true"></span
					><span>Establishing connection…</span>
				</div>
				<div id="page-error" class="page-message page-error" hidden>
					<svg viewBox="0 0 24 24" aria-hidden="true">
						<path d="M12 8v5M12 17h.01" />
						<circle cx="12" cy="12" r="9" />
					</svg>
					<strong>That page couldn’t be opened.</strong
					><span id="page-error-detail">Check the address and try again.</span
					><button id="try-again-button" type="button">Try again</button>
				</div>
			</div>
		</section>
		<input
			id="search-engine"
			value="https://www.google.com/search?q=%s"
			type="hidden"
		/>
	</body>
</html>
